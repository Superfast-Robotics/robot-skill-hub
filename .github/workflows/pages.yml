name: Publish catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/build_catalog.py --hub-commit "$GITHUB_SHA" --base-url "${SITE_BASE_URL:-https://hub.superfastrobotics.com}"
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed catalog
        id: deployment
        uses: actions/deploy-pages@v4
  sync:
    name: Activate reviewed catalog index
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.repository == 'Superfast-Robotics/robot-skill-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Sync one pinned generation after Pages deployment
        run: python tools/sync_catalog.py --hub-commit "$GITHUB_SHA" --timeout-seconds 540
        env:
          CATALOG_SYNC_KEY: ${{ secrets.CATALOG_SYNC_KEY }}
          RSH_TELEMETRY: 'off'
