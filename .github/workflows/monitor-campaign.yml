name: Observe fixed launch campaign

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: fixed-launch-campaign-monitor
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'Superfast-Robotics/robot-skill-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      window_closed: ${{ steps.window.outputs.closed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read counters without adding eligible accesses
        run: python tools/monitor_campaign.py --external --output "$RUNNER_TEMP/campaign-monitor"
      - name: Read the fixed deadline
        id: window
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          deadline = datetime(2026, 10, 18, 15, 47, 38, tzinfo=timezone.utc)
          closed = datetime.now(timezone.utc) >= deadline
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('closed=' + str(closed).lower() + '\n')
          PY
      - name: Preserve timestamped observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/campaign-monitor
          retention-days: 7
          if-no-files-found: warn

  stop_after_deadline:
    needs: observe
    if: always() && needs.observe.outputs.window_closed == 'true' && github.repository == 'Superfast-Robotics/robot-skill-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Disable only this completed campaign monitor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          import urllib.request

          if datetime.now(timezone.utc) < datetime(2026, 10, 18, 15, 47, 38, tzinfo=timezone.utc):
              raise SystemExit('The fixed campaign window is still open')
          url = 'https://api.github.com/repos/Superfast-Robotics/robot-skill-hub/actions/workflows/monitor-campaign.yml/disable'
          request = urllib.request.Request(url, method='PUT', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'robot-skill-hub-monitor/0.2.0',
              'DNT': '1',
              'X-RSH-Telemetry': 'off',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError('The campaign monitor could not disable itself')
          print('The fixed 24-hour campaign has ended. This monitoring workflow is now disabled.')
          PY
